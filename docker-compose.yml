services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        UID: 1000
        GID: 1000
    container_name: omrchecker_backend
    restart: unless-stopped
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--timeout-keep-alive", "600", "--timeout-graceful-shutdown", "600"]
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./backend:/app/backend
    environment:
      - PORT=8000
      - CORS_ORIGINS=["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

